<section class="bb-faith-section" data-bb-faith-book>
  <div class="bb-faith-wrap">
    <p class="bb-faith-kicker">Faith Behind The Brand</p>
    <h2>Every product carries a story.</h2>
    <p class="bb-faith-intro">
      Explore the faith, purpose, and restoration woven into each Blessed Billionairess story.
    </p>

    <div class="bb-butterfly-stage" aria-live="polite">
      <article class="bb-story-panel">
        <p class="bb-story-label">Now reading</p>
        <h3 data-bb-story-title></h3>
        <p data-bb-story-text></p>
      </article>

      <button class="bb-wing bb-wing-left bb-wing-slot-1 is-active" type="button" aria-pressed="true" data-story-title="Lovely Restoration" data-story-text="Lovely Restoration was created to represent beauty, healing, and renewal. This collection supports the journey of restoration from the inside out, encouraging confidence, care, and faith-filled transformation.">
        <span>Lovely Restoration</span>
      </button>
      <button class="bb-wing bb-wing-right bb-wing-slot-2" type="button" aria-pressed="false" data-story-title="Billionhairess" data-story-text="Billionhairess represents beauty, excellence, and confidence. Each piece is designed to help women walk boldly in the beauty and purpose God has given them.">
        <span>Billionhairess</span>
      </button>
      <button class="bb-wing bb-wing-left bb-wing-slot-3" type="button" aria-pressed="false" data-story-title="Scents of Heaven" data-story-text="Scents of Heaven was created to bless and brighten personal spaces through luxury fragrance, peace, and intentional moments of faith-filled reflection.">
        <span>Scents of Heaven</span>
      </button>
      <button class="bb-wing bb-wing-right bb-wing-slot-4" type="button" aria-pressed="false" data-story-title="Spread The Good News" data-story-text="Spread The Good News Apparel was created to inspire conversations, share the Gospel, and remind believers to wear their faith with boldness, purpose, and identity.">
        <span>Spread The Good News</span>
      </button>
    </div>
  </div>

  <style>
    .bb-faith-section {
      --bb-black: #070707;
      --bb-cream: #f7f3ee;
      --bb-gold: #c8a25a;
      --bb-red: #cf1f2e;
      --bb-coral: #f26a4f;
      --bb-teal: #00a8c6;
      --bb-blue: #145f93;
      --bb-ink: #1a1a1a;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(207, 31, 46, 0.2), transparent 28rem),
        radial-gradient(circle at 80% 35%, rgba(0, 168, 198, 0.14), transparent 30rem),
        var(--bb-black);
      color: var(--bb-cream);
      padding: 90px 20px;
    }

    .bb-faith-wrap { max-width: 1180px; margin: 0 auto; text-align: center; }
    .bb-faith-kicker { color: var(--bb-gold); text-transform: uppercase; letter-spacing: 0.22em; font-size: 12px; margin: 0 0 16px; }
    .bb-faith-section h2 { margin: 0 auto 18px; max-width: 780px; color: var(--bb-cream); }
    .bb-faith-intro { max-width: 680px; margin: 0 auto 55px; font-size: 18px; line-height: 1.7; color: rgba(247, 243, 238, 0.78); }

    .bb-butterfly-stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(280px, 1.15fr) minmax(210px, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 18px 20px;
      align-items: stretch;
      perspective: 1400px;
      perspective-origin: 50% 50%;
      isolation: isolate;
    }

    .bb-story-panel {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      background: linear-gradient(145deg, #fffaf2, #efe5d6);
      color: var(--bb-ink);
      border: 1px solid rgba(200, 162, 90, 0.9);
      border-radius: 34px;
      padding: 42px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.46);
      transition: opacity 0.22s ease, transform 0.32s ease;
      z-index: 3;
    }

    .bb-story-panel.is-changing { opacity: 0.16; transform: scale(0.94); }
    .bb-story-label { margin: 0 0 12px; color: var(--bb-gold); font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
    .bb-story-panel h3 { margin: 0 0 20px; color: #8f1d2c; font-size: clamp(30px, 4vw, 48px); line-height: 1; }
    .bb-story-panel h3::after { content: ""; display: block; width: 82px; height: 2px; background: var(--bb-gold); margin-top: 14px; }
    .bb-story-panel p:last-child { margin: 0; font-size: 17px; line-height: 1.8; }

    .bb-wing {
      position: relative;
      width: 100%;
      max-width: 340px;
      min-height: 188px;
      overflow: hidden;
      border: 1px solid rgba(200, 162, 90, 0.62);
      color: var(--bb-cream);
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, filter;
      transition: border-color 0.28s ease, box-shadow 0.28s ease, filter 0.28s ease, transform 0.84s cubic-bezier(.16,.9,.18,1);
      backface-visibility: visible;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 26px 60px rgba(0, 0, 0, 0.32);
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.34));
      background:
        radial-gradient(ellipse at 28% 24%, rgba(255, 244, 199, 0.9) 0 7%, transparent 8%),
        radial-gradient(ellipse at 52% 56%, rgba(255, 122, 102, 0.72) 0 18%, transparent 19%),
        radial-gradient(ellipse at 72% 70%, rgba(0, 168, 198, 0.72) 0 13%, transparent 14%),
        repeating-linear-gradient(104deg, rgba(16, 8, 8, 0.92) 0 4px, transparent 5px 30px),
        linear-gradient(135deg, #1a0c0a 0%, var(--bb-red) 18%, var(--bb-coral) 39%, var(--bb-teal) 58%, var(--bb-blue) 70%, var(--bb-red) 88%, #200808 100%);
    }

    .bb-wing-left { justify-self: end; transform-origin: 100% 50%; border-radius: 92% 18% 80% 28% / 68% 24% 86% 38%; clip-path: ellipse(49% 43% at 52% 50%); animation: bb-left-wing-flap 3.1s ease-in-out infinite; }
    .bb-wing-right { justify-self: start; transform-origin: 0% 50%; border-radius: 18% 92% 28% 80% / 24% 68% 38% 86%; clip-path: ellipse(49% 43% at 48% 50%); animation: bb-right-wing-flap 3.1s ease-in-out infinite; }
    .bb-wing-slot-1 { grid-column: 1; grid-row: 1; align-self: end; }
    .bb-wing-slot-2 { grid-column: 3; grid-row: 1; align-self: end; }
    .bb-wing-slot-3 { grid-column: 1; grid-row: 2; align-self: start; }
    .bb-wing-slot-4 { grid-column: 3; grid-row: 2; align-self: start; }

    .bb-wing::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: inherit;
      background:
        radial-gradient(ellipse at 46% 48%, transparent 0 13%, rgba(8, 6, 6, 0.72) 14% 16%, transparent 17%),
        radial-gradient(ellipse at 32% 30%, transparent 0 16%, rgba(8, 6, 6, 0.56) 17% 19%, transparent 20%),
        linear-gradient(118deg, transparent 0 26%, rgba(255, 218, 121, 0.52) 27% 33%, transparent 34% 100%),
        linear-gradient(38deg, transparent 0 55%, rgba(0, 168, 198, 0.58) 56% 61%, transparent 62% 100%);
      opacity: 0.86;
      pointer-events: none;
    }

    .bb-wing::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,0.52), transparent 7rem),
        linear-gradient(90deg, rgba(255,255,255,0.14), transparent 34%, rgba(0,0,0,0.28));
      mix-blend-mode: screen;
      opacity: 0.78;
      pointer-events: none;
    }

    .bb-wing span {
      position: relative;
      z-index: 2;
      display: grid;
      min-height: inherit;
      place-items: center;
      padding: 24px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.18;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.72);
    }

    .bb-wing:hover, .bb-wing.is-active { border-color: var(--bb-gold); filter: saturate(1.18) brightness(1.08) drop-shadow(0 24px 32px rgba(0, 0, 0, 0.42)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 30px 70px rgba(0,0,0,0.48), 0 0 28px rgba(200,162,90,0.18); }
    .bb-wing.is-active span { color: #ffffff; }

    .bb-butterfly-stage.is-flapping .bb-wing-left { transform: translateX(18px) translateZ(86px) rotateX(-3deg) rotateY(88deg) rotateZ(-2deg) scale(0.96); animation-play-state: paused; }
    .bb-butterfly-stage.is-flapping .bb-wing-right { transform: translateX(-18px) translateZ(86px) rotateX(-3deg) rotateY(-88deg) rotateZ(2deg) scale(0.96); animation-play-state: paused; }

    @keyframes bb-left-wing-flap {
      0%, 100% { transform: translateX(0) translateZ(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
      18% { transform: translateX(7px) translateZ(28px) rotateX(-2deg) rotateY(32deg) rotateZ(-1deg) scale(1.015); }
      36% { transform: translateX(16px) translateZ(72px) rotateX(-3deg) rotateY(78deg) rotateZ(-2deg) scale(0.98); }
      54% { transform: translateX(10px) translateZ(38px) rotateX(-2deg) rotateY(46deg) rotateZ(-1deg) scale(1.01); }
      76% { transform: translateX(2px) translateZ(8px) rotateX(0deg) rotateY(10deg) rotateZ(0deg) scale(1); }
    }

    @keyframes bb-right-wing-flap {
      0%, 100% { transform: translateX(0) translateZ(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
      18% { transform: translateX(-7px) translateZ(28px) rotateX(-2deg) rotateY(-32deg) rotateZ(1deg) scale(1.015); }
      36% { transform: translateX(-16px) translateZ(72px) rotateX(-3deg) rotateY(-78deg) rotateZ(2deg) scale(0.98); }
      54% { transform: translateX(-10px) translateZ(38px) rotateX(-2deg) rotateY(-46deg) rotateZ(1deg) scale(1.01); }
      76% { transform: translateX(-2px) translateZ(8px) rotateX(0deg) rotateY(-10deg) rotateZ(0deg) scale(1); }
    }

    @media screen and (max-width: 749px) {
      .bb-faith-section { padding: 54px 18px 60px; }
      .bb-faith-intro { margin-bottom: 34px; font-size: 15px; line-height: 1.6; }
      .bb-butterfly-stage { grid-template-columns: 1fr 1fr; gap: 14px; perspective: 900px; }
      .bb-story-panel { grid-column: 1 / -1; grid-row: 2; min-height: auto; padding: 30px 24px; }
      .bb-wing { min-height: 112px; }
      .bb-wing span { padding: 14px; font-size: 16px; }
      .bb-wing-slot-1 { grid-column: 1; grid-row: 1; }
      .bb-wing-slot-2 { grid-column: 2; grid-row: 1; }
      .bb-wing-slot-3 { grid-column: 1; grid-row: 3; }
      .bb-wing-slot-4 { grid-column: 2; grid-row: 3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bb-wing, .bb-butterfly-stage.is-flapping .bb-wing-left, .bb-butterfly-stage.is-flapping .bb-wing-right { animation: none !important; transform: none !important; transition: none !important; }
      .bb-story-panel { transition: none; }
    }
  </style>

  <script>
    (function () {
      var section = document.currentScript.closest('[data-bb-faith-book]');
      if (!section || section.dataset.bbInitialized === 'true') return;
      section.dataset.bbInitialized = 'true';

      var stage = section.querySelector('.bb-butterfly-stage');
      var buttons = section.querySelectorAll('.bb-wing');
      var panel = section.querySelector('.bb-story-panel');
      var title = section.querySelector('[data-bb-story-title]');
      var text = section.querySelector('[data-bb-story-text]');
      var isFlapping = false;

      function renderStory(button) {
        title.textContent = button.dataset.storyTitle || '';
        text.textContent = button.dataset.storyText || '';
      }

      function selectStory(button, skipAnimation) {
        if (!button || isFlapping) return;
        isFlapping = !skipAnimation;

        if (!skipAnimation) {
          stage.classList.add('is-flapping');
          panel.classList.add('is-changing');
        }

        buttons.forEach(function (btn) {
          btn.classList.toggle('is-active', btn === button);
          btn.setAttribute('aria-pressed', btn === button ? 'true' : 'false');
        });

        window.setTimeout(function () {
          renderStory(button);
        }, skipAnimation ? 0 : 360);

        if (!skipAnimation) {
          window.setTimeout(function () {
            stage.classList.remove('is-flapping');
            panel.classList.remove('is-changing');
          }, 760);

          window.setTimeout(function () {
            isFlapping = false;
          }, 920);
        }
      }

      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          selectStory(button, false);
        });
      });

      selectStory(section.querySelector('.bb-wing.is-active') || buttons[0], true);
    })();
  </script>
</section>
